name: ${APP_NAME}
services:
  database:
    container_name: ${APP_NAME}-database
    restart: always
    image: postgres:18.4-alpine
    ports:
      - host_ip: 127.0.0.1
        published: 5432
        target: 5432
        protocol: tcp
    networks:
      - isolated
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - psql-data:/var/lib/postgresql
      - ./migration.sql://docker-entrypoint-initdb.d/migration.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  database-manager:
    container_name: ${APP_NAME}-database-manager
    image: dpage/pgadmin4:9.15.0
    ports:
      - host_ip: 127.0.0.1
        published: 4444
        target: 80
        protocol: tcp
    networks:
      - isolated
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://127.0.0.1:80/misc/ping"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - db-manager-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
networks:
  isolated:
    driver: bridge
volumes:
  psql-data:
  db-manager-data:
