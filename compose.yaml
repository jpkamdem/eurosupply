name: ${APP_NAME}
services:
  database:
    container_name: ${APP_NAME}-database
    restart: unless-stopped
    image: postgres:18.6-trixie@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    ports:
      - host_ip: 127.0.0.1
        published: 5432
        target: 5432
        protocol: tcp
    networks:
      - isolated
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - psql-data:/var/lib/postgresql
      - ./migration.sql://docker-entrypoint-initdb.d/migration.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  database-manager:
    container_name: ${APP_NAME}-database-manager
    image: dpage/pgadmin4:9.18.0@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    ports:
      - host_ip: 127.0.0.1
        published: 4444
        target: 80
        protocol: tcp
    networks:
      - isolated
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://127.0.0.1:80/misc/ping"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - db-manager-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
  server:
    container_name: ${APP_NAME}-server
    restart: unless-stopped
    image: ${APP_NAME}/spring:0.5
    build:
      context: ./
      dockerfile: Dockerfile
      target: spring
    ports:
      - host_ip: 127.0.0.1
        published: 3000
        target: 3000
        protocol: tcp
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fkS", "http://127.0.0.1:3000/actuator/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - isolated
    depends_on:
      database:
        condition: service_healthy
  web:
    container_name: ${APP_NAME}-web
    restart: unless-stopped
    image: ${APP_NAME}/angular:0.5
    build:
      context: ./
      dockerfile: Dockerfile
      target: angular
    ports:
      - host_ip: 127.0.0.1
        published: 8080
        target: 4000
        protocol: tcp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000').then(res => console.log(res.status))"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - isolated
    depends_on:
      database:
        condition: service_healthy
  monitoring-engine:
    container_name: ${APP_NAME}-monitoring-engine
    restart: unless-stopped
    image: prom/prometheus:main-distroless@sha256:a9581cffe6395a275d5712645284df1933a526aaf3d4c53aff46934ef1b8ac19
    ports:
      - host_ip: 127.0.0.1
        published: 9090
        target: 9090
        protocol: tcp
    networks:
      - isolated
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
  monitoring:
    container_name: ${APP_NAME}-monitoring
    restart: unless-stopped
    image: grafana/grafana:nightly-distroless-slim@sha256:868db446935b5e84a7f24a9c199936357970cdc3cb467a1592ca02a33acaa2e4
    ports:
      - host_ip: 127.0.0.1
        published: 7070
        target: 3000
        protocol: tcp
    networks:
      - isolated
    volumes:
      - grafana-storage:/var/lib/grafana

networks:
  isolated:
    driver: bridge
volumes:
  psql-data:
  db-manager-data:
  prometheus-storage:
  grafana-storage:
