name: Pipeline run #$GITHUB_RUN_NUMBER

on:
  push:
  workflow_dispatch:

jobs:
  web-testing:
    runs-on: ubuntu-24.04
    environment: global

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run web tests
        working-directory: web
        run: npm run test

  server-testing:
    runs-on: ubuntu-24.04
    environment: global
    services:
      database:
        image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        ports:
          - 5432:5432
        volumes:
          - ./migration.sql:/docker-entrypoint-initdb.d/migration.sql:ro
        env:
          POSTGRES_DB: ${{ vars.APP_NAME }}_db
          POSTGRES_USER: ${{ secrets.POSTGRES_USER}}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD}}
        options: >
          --health-cmd "pg_isready -U ${{ secrets.POSTGRES_USER }} -d ${{ vars.APP_NAME }}_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies
        working-directory: server
        run: ./mvnw clean install

      - name: Run server tests
        working-directory: server
        run: ./mvnw clean verify

  web-building:
    runs-on: ubuntu-24.04
    needs: [web-testing]
    environment: global
    env:
      WEB_IMAGE: ${{ vars.APP_NAME }}/angular:1.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Building web image
        run: |
          docker build -t $WEB_IMAGE .
          docker save $WEB_IMAGE -o web.tar

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: web.tar

  server-building:
    runs-on: ubuntu-24.04
    needs: [server-testing]
    environment: global
    env:
      SERVER_IMAGE: ${{ vars.APP_NAME }}/spring:1.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Building server image
        run: |
          docker build -t $SERVER_IMAGE .
          docker save $SERVER_IMAGE -o server.tar

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-artifact
          path: server.tar

  deployment:
    runs-on: ubuntu-24.04
    needs: [web-building, server-building]

    steps:
      - name: Download web image
        uses: actions/download-artifact@v4
        with:
          name: web-artifact
          path: .

      - name: Download server image
        uses: actions/download-artifact@v4
        with:
          name: server-artifact
          path: .
