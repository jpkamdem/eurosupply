name: Pipeline run #$GITHUB_RUN_NUMBER

on:
  push:
  workflow_dispatch:

jobs:
  web-testing:
    runs-on: ubuntu-24.04
    environment: global

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run web tests
        working-directory: web
        run: npm run test

  web-building:
    runs-on: ubuntu-24.04
    needs: [web-testing]
    environment: global
    env:
      WEB_IMAGE: ${{ vars.APP_NAME }}/angular:1.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Building web image
        run: |
          docker build -t $WEB_IMAGE .
          docker save $WEB_IMAGE -o web.tar

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: web.tar

  server-building:
    runs-on: ubuntu-24.04
    environment: global
    env:
      SERVER_IMAGE: ${{ vars.APP_NAME }}/spring:1.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Building server image
        run: |
          docker build -t $SERVER_IMAGE .
          docker save $SERVER_IMAGE -o server.tar

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-artifact
          path: server.tar

  deployment:
    runs-on: ubuntu-24.04
    needs: [web-building, server-building]

    steps:
      - name: Download web image
        uses: actions/download-artifact@v4
        with:
          name: web-artifact
          path: .

      - name: Download server image
        uses: actions/download-artifact@v4
        with:
          name: server-artifact
          path: .
