<div [id]="id()" class="item">
  <p class="item-name">
    {{ name() }}
  </p>

  <p class="item-quantity">
    {{ quantity() }}
    @switch (unit()) {
      @case ('unit') {
        unités
      }
      @case ('kg') {
        kg
      }
      @case ('L') {
        L
      }
    }
  </p>

  <p class="item-expiration">
    À consommer avant : {{ expiration() | date: 'dd/MM/yyyy' }}
  </p>
  <div class="btn-container">
    <button><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus preview-icon"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    <button><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-minus preview-icon"><path d="M5 12h14"/></svg></button>
  </div>
</div>
