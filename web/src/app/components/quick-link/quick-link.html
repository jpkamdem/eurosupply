<div class="quick-link">
  <a [routerLink]="['/']">Accueil</a> >
  <a [routerLink]="['/' + path()]" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">{{
    textLink() }}</a>
</div>
<div class="cart-link">
  <a [routerLink]="['/panier']"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="lucide lucide-shopping-cart preview-icon">
      <path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18" />
      <path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25" />
      <circle cx="18" cy="20" r="2" />
      <circle cx="8" cy="20" r="2" />
    </svg>
    @if (cartService.count() > 0) {
    <span class="cart-count">
      {{ cartService.count() }}
    </span>
    }</a>
</div>
