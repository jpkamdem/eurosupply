<app-quick-link path="aliments" textLink="Aliments" />
<div class="center-container">
  <div class="aliments-container">
    @for (aliment of alimentsList(); track $index) {
      <app-aliment-item
      [id]="aliment.id"
      [name]="aliment.name"
      [quantity]="aliment.quantity"
      [unit]="aliment.unit"
      [expiration]="aliment.expiration"
    />
  }
  </div>
</div>
